<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=https://www.linkedin.com/in/iamhasime" />
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 40px 50px;
      }
      
      h1 {
        font-weight: 100;
        font-stretch: normal;
        font-size: 3em;
      }
      
      .slider {
        position: absolute;
        width: 400px;
        height: 2px;
        margin-top: -30px;
      }
      
      .line {
        position: absolute;
        background: #000000;
        width: 400px;
        height: 2px;
      }
      
      .break {
        position: absolute;
        background: #FFFFFF;
        width: 6px;
        height: 2px;
      }
      
      .dot1 { animation: loading 2s infinite; }
      .dot2 { animation: loading 2s 0.5s infinite; }
      .dot3 { animation: loading 2s 1s infinite; }

      @keyframes loading {
        from { left: 0; }
        to { left: 400px; }
      }
    </style>
  </head>
  <body>
    <br /><br /><br />
    <h1>Hey, nice meeting you!</h1>
    <div class="slider">
      <div class="line"></div>
      <div class="break dot1"></div>
      <div class="break dot2"></div>
      <div class="break dot3"></div>
    </div>
    <p>Redirecting you... Not working? <a href="https://www.linkedin.com/in/iamhasime">Click here.</a></p>
  </body>
</html>
